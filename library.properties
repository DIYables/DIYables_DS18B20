sentence=Non-blocking library for the DS18B20 1-Wire temperature sensor
paragraph=Reads the DS18B20 temperature sensor without blocking the sketch. The 750 ms conversion and the 1-Wire transfer are both run as a state machine, so a call of loop() never takes longer than about 90 microseconds, and the library reports that figure at runtime with getMaxLoopTime(). Supports several sensors on one pin, ROM address search, 9 to 12 bit resolution, CRC checking, and parasite power. Uses only standard Arduino APIs and has no dependencies, so it works on Arduino, ESP32, ESP8266 and other platforms.
